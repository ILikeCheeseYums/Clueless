<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Street View Navigator</title>
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚶‍♂️</text></svg>">
</head>
<body class="w-full h-full overflow-hidden bg-[#0b0c0e] text-[#f1f3f4] select-none font-sans antialiased">
  <div id="app-container" class="relative w-screen h-screen overflow-hidden flex flex-col">
    <!-- Viewport & 3D Street View Scene -->
    <main class="viewport absolute inset-0 overflow-hidden cursor-grab active:cursor-grabbing bg-[#0b0c0e] [perspective:1000px]" id="viewport" role="region" aria-label="Interactive Street View Canvas">
      <div class="scene-wrapper absolute inset-0 w-full h-full [transform-style:preserve-3d] will-change-transform" id="scene-wrapper">
        <div class="panorama-layer layer-current absolute inset-0 w-full h-full bg-center bg-no-repeat z-[1] will-change-transform" id="layer-a"></div>
        <div class="panorama-layer layer-next absolute inset-0 w-full h-full bg-center bg-no-repeat z-[2] opacity-0 pointer-events-none will-change-transform" id="layer-b"></div>
      </div>

      <!-- Vignette depth overlay -->
      <div class="vignette-overlay absolute inset-0 pointer-events-none z-[3]"></div>

      <!-- Floor Navigation Indicator Ring & Chevrons -->
      <div class="nav-arrows-container absolute inset-0 pointer-events-none z-10 [perspective:600px]" id="nav-arrows-container">
        <div class="floor-target-ring" id="floor-target-ring"></div>
        <div id="nav-arrows"></div>
      </div>

      <!-- 360 Panorama Indicator Badge -->
      <div id="pano-badge" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-20 px-3 py-1 rounded-full bg-[#20232a]/90 backdrop-blur-md border border-white/10 text-[11px] text-[#8ab4f8] font-medium shadow-md pointer-events-none flex items-center gap-1.5 transition-opacity">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a10 10 0 0 1 10 10"></path>
        </svg>
        <span>360° Panorama</span>
      </div>
    </main>

    <!-- Top-Left Toolbar: Minimap Toggle & Direct Add Images Button -->
    <aside class="minimap-wrapper absolute top-4 left-4 z-20 pointer-events-auto flex flex-col items-start gap-2" id="minimap-wrapper">
      <div class="flex items-center gap-2">
        <!-- Minimized Map Icon Trigger -->
        <button class="w-10 h-10 rounded-xl bg-[#20232a]/90 backdrop-blur-md border border-white/10 text-white shadow-lg flex items-center justify-center cursor-pointer transition-colors hover:bg-[#2d323c] hover:border-white/25" id="toggle-minimap-btn" title="Toggle Map (M)">
          <svg class="w-5 h-5 text-[#8ab4f8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
        </button>

        <!-- Direct Add Images Button -->
        <button class="w-10 h-10 rounded-xl bg-[#20232a]/90 backdrop-blur-md border border-white/10 text-white shadow-lg flex items-center justify-center cursor-pointer transition-colors hover:bg-[#2d323c] hover:border-white/25" id="direct-add-btn" title="Add / Change Images">
          <svg class="w-5 h-5 text-[#8ab4f8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
            <line x1="12" y1="8" x2="12" y2="14"></line>
            <line x1="9" y1="11" x2="15" y2="11"></line>
          </svg>
        </button>
      </div>

      <!-- Expandable Minimap Card -->
      <div class="minimap-card w-[240px] sm:w-[260px] bg-[#20232a]/95 backdrop-blur-md border border-white/10 rounded-2xl shadow-2xl overflow-hidden flex flex-col" id="minimap-card" style="display: none;">
        <div class="minimap-header px-3.5 py-2.5 bg-[#121316]/70 border-b border-white/10 flex items-center justify-between">
          <div class="w-6 h-6 rounded-md bg-[#1a73e8] flex items-center justify-center text-white shrink-0">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <button class="p-1 text-[#9aa0a6] hover:text-white rounded transition-colors cursor-pointer" id="close-minimap-btn" title="Minimize Map">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="minimap-body relative w-full h-[180px] bg-gradient-to-b from-[#1e222b] to-[#14161d] overflow-hidden">
          <svg class="minimap-canvas w-full h-full block" id="minimap-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <!-- Footer: Add Images & Reset Buttons -->
        <div class="px-3.5 py-2.5 bg-[#121316]/70 border-t border-white/10 flex items-center justify-between text-[11px] text-[#9aa0a6]">
          <button id="add-images-btn" class="cursor-pointer hover:text-white flex items-center gap-1.5 transition-colors" title="Select images to add">
            <svg class="w-3.5 h-3.5 text-[#8ab4f8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span>Add Images</span>
          </button>
          <button id="reset-tour-btn" class="cursor-pointer hover:text-white flex items-center gap-1 text-[10px] opacity-70 hover:opacity-100 transition-opacity" title="Reset to initial tour">
            <svg class="w-3 h-3 text-[#9aa0a6]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span>Reset</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Hidden File Input for All Triggers -->
    <input type="file" id="image-file-input" multiple accept="image/*" class="hidden">

    <!-- Top-Right: Fullscreen Toggle -->
    <div class="absolute top-4 right-4 z-20 pointer-events-auto">
      <button class="p-2.5 rounded-full bg-[#20232a]/90 backdrop-blur-md border border-white/10 text-[#f1f3f4] cursor-pointer shadow-md transition-colors hover:bg-[#2d323c] hover:border-white/25" id="fullscreen-btn" title="Toggle Fullscreen">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>

    <!-- Bottom-Right: Fit/Fill Toggle & Zoom Controls -->
    <div class="view-controls absolute bottom-6 right-4 flex flex-col gap-2 z-20 pointer-events-auto">
      <div class="view-btn-group bg-[#20232a]/90 backdrop-blur-md border border-white/10 rounded-lg flex flex-col overflow-hidden shadow-lg divide-y divide-white/10">
        <!-- Toggle Fit / Fill (No Crop) -->
        <button class="w-10 h-10 flex items-center justify-center text-[#f1f3f4] transition-colors hover:bg-white/15 hover:text-white active:bg-[#1a73e8]" id="fit-toggle-btn" title="Toggle Fit (No Crop) / Fill Screen">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
        <button class="w-10 h-10 flex items-center justify-center text-[#f1f3f4] transition-colors hover:bg-white/15 hover:text-white active:bg-[#1a73e8]" id="zoom-in-btn" title="Zoom In (+)">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="w-10 h-10 flex items-center justify-center text-[#f1f3f4] transition-colors hover:bg-white/15 hover:text-white active:bg-[#1a73e8]" id="zoom-out-btn" title="Zoom Out (-)">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="w-10 h-10 flex items-center justify-center text-[#f1f3f4] transition-colors hover:bg-white/15 hover:text-white active:bg-[#1a73e8]" id="zoom-reset-btn" title="Reset View (0 or Esc)">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Drag & Drop Fullscreen Overlay -->
    <div id="drag-overlay" class="hidden absolute inset-0 z-50 bg-[#121316]/90 backdrop-blur-md border-4 border-dashed border-[#1a73e8] flex flex-col items-center justify-center gap-3 pointer-events-none transition-all">
      <div class="w-16 h-16 rounded-2xl bg-[#1a73e8]/20 border border-[#1a73e8]/50 flex items-center justify-center text-[#8ab4f8]">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      </div>
      <div class="text-sm font-semibold text-white">Drop Images or Folder to Add</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
