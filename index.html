<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corridor Street View — Graph-Based Walkthrough</title>
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚶‍♂️</text></svg>">
</head>
<body class="w-full h-full overflow-hidden bg-[#121316] text-[#f1f3f4] select-none font-sans antialiased">
  <div id="app-container" class="relative w-screen h-screen overflow-hidden flex flex-col">
    <!-- Viewport & 3D Street View Scene -->
    <main class="viewport absolute inset-0 overflow-hidden cursor-grab active:cursor-grabbing bg-[#0b0c0e] [perspective:1000px]" id="viewport" role="region" aria-label="Interactive Street View Canvas">
      <div class="scene-wrapper absolute top-1/2 left-1/2 w-[116%] h-[116%] [transform-style:preserve-3d] will-change-transform" id="scene-wrapper">
        <!-- Dual layers for crossfade & warp transitions -->
        <div class="panorama-layer layer-current absolute inset-0 w-full h-full bg-center bg-no-repeat bg-cover z-[1] will-change-transform" id="layer-a"></div>
        <div class="panorama-layer layer-next absolute inset-0 w-full h-full bg-center bg-no-repeat bg-cover z-[2] opacity-0 pointer-events-none will-change-transform" id="layer-b"></div>
      </div>

      <!-- Vignette depth overlay -->
      <div class="vignette-overlay absolute inset-0 pointer-events-none z-[3]"></div>

      <!-- Floor Navigation Indicator Ring & Chevrons -->
      <div class="nav-arrows-container absolute inset-0 pointer-events-none z-10 [perspective:600px]" id="nav-arrows-container">
        <div class="floor-target-ring" id="floor-target-ring"></div>
        <div id="nav-arrows"></div>
      </div>
    </main>

    <!-- Top-Left: Minimized Map Icon & Expandable Minimap Card -->
    <aside class="minimap-wrapper absolute top-4 left-4 z-20 pointer-events-auto" id="minimap-wrapper">
      <!-- Minimized Icon Trigger -->
      <button class="w-10 h-10 rounded-xl bg-[#20232a]/90 backdrop-blur-md border border-white/10 text-white shadow-lg flex items-center justify-center cursor-pointer transition-colors hover:bg-[#2d323c] hover:border-white/25" id="toggle-minimap-btn" title="Toggle Floor Plan Map (M)">
        <svg class="w-5 h-5 text-[#8ab4f8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
      </button>

      <!-- Expandable Minimap Card (Hidden by Default for Zero Clutter) -->
      <div class="minimap-card mt-2 w-[240px] sm:w-[260px] bg-[#20232a]/95 backdrop-blur-md border border-white/10 rounded-2xl shadow-2xl overflow-hidden flex flex-col" id="minimap-card" style="display: none;">
        <div class="minimap-header px-3.5 py-2.5 bg-[#121316]/70 border-b border-white/10 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 overflow-hidden">
            <div class="w-6 h-6 rounded-md bg-[#1a73e8] flex items-center justify-center text-white shrink-0">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </div>
            <div class="flex flex-col overflow-hidden">
              <div class="text-xs font-semibold text-[#f1f3f4] truncate" id="loc-title">Loading Corridor...</div>
              <div class="text-[10px] text-[#8ab4f8] font-medium" id="loc-step-badge">Node 1 of 4</div>
            </div>
          </div>
          <button class="p-1 text-[#9aa0a6] hover:text-white rounded transition-colors cursor-pointer" id="close-minimap-btn" title="Minimize Map">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="minimap-body relative w-full h-[180px] bg-gradient-to-b from-[#1e222b] to-[#14161d] overflow-hidden">
          <svg class="minimap-canvas w-full h-full block" id="minimap-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>
    </aside>

    <!-- Top-Right: Fullscreen Toggle -->
    <div class="absolute top-4 right-4 z-20 pointer-events-auto">
      <button class="p-2.5 rounded-full bg-[#20232a]/90 backdrop-blur-md border border-white/10 text-[#f1f3f4] cursor-pointer shadow-md transition-colors hover:bg-[#2d323c] hover:border-white/25" id="fullscreen-btn" title="Toggle Fullscreen">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>

    <!-- Bottom-Right: Zoom & Reset View Controls -->
    <div class="view-controls absolute bottom-6 right-4 flex flex-col gap-2 z-20 pointer-events-auto">
      <div class="view-btn-group bg-[#20232a]/90 backdrop-blur-md border border-white/10 rounded-lg flex flex-col overflow-hidden shadow-lg divide-y divide-white/10">
        <button class="w-10 h-10 flex items-center justify-center text-[#f1f3f4] transition-colors hover:bg-white/15 hover:text-white active:bg-[#1a73e8]" id="zoom-in-btn" title="Zoom In (+)">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="w-10 h-10 flex items-center justify-center text-[#f1f3f4] transition-colors hover:bg-white/15 hover:text-white active:bg-[#1a73e8]" id="zoom-out-btn" title="Zoom Out (-)">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="w-10 h-10 flex items-center justify-center text-[#f1f3f4] transition-colors hover:bg-white/15 hover:text-white active:bg-[#1a73e8]" id="zoom-reset-btn" title="Reset View (0 or Esc)">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
